<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f8c7b">
  <title>평행도시</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="app">
  <header>
    <button class="brand" data-tab="observe"><img src="./icons/icon-192.png" alt=""><span><b>평행도시</b><small>캐릭터 생활 관찰 시뮬레이터</small></span></button>
    <nav id="tabs"></nav>
    <div class="account"><span id="syncStatus">기기 저장</span><button id="loginBtn" class="soft">Google 로그인</button><select id="quickChar"></select></div>
  </header>
  <main>
    <section id="view-observe" class="view">
      <div id="observerCharacters" class="observer-characters"></div>
      <div class="observe-grid">
        <article class="panel map-panel">
          <div class="map-toolbar">
            <div><small>현재 시각</small><b id="clock"></b></div>
            <label>마을<select id="observeTown"></select></label>
            <div class="watching"><small>관찰 중</small><b id="watchingText"></b></div>
          </div>
          <div id="townCanvas" class="town-canvas"></div>
        </article>
        <aside>
          <article id="profileCard" class="panel profile-card"></article>
          <article id="lifeLog" class="panel life-log"></article>
        </aside>
      </div>
    </section>

    <section id="view-home" class="view hidden"><div class="page-title"><h1>우리 집 생활</h1><button id="editHomes" class="soft">집 편집</button></div><div id="homes"></div></section>

    <section id="view-characters" class="view hidden">
      <div class="editor-grid">
        <aside class="panel list-panel"><div class="panel-title"><h2>캐릭터 목록</h2><button id="newCharacter">+ 생성</button></div><div id="characterList"></div></aside>
        <article class="panel form-panel">
          <h2>프로필</h2>
          <form id="characterForm">
            <div class="fields">
              <label>캐릭터 이름<input id="charName" required></label>
              <label>직업<select id="charJob"></select></label>
              <label id="customJobWrap" class="hidden">직업 직접 입력<input id="charCustomJob"></label>
              <label>현재 기분<select id="charMood"><option>평온함</option><option>기쁨</option><option>피곤함</option><option>우울함</option><option>예민함</option></select></label>
              <label>프로필 사진<input id="charPhoto" type="file" accept="image/*"></label>
              <label>캐릭터 아이콘 (선택)<input id="charIcon" type="file" accept="image/*"></label>
              <label>대표 테마색<input id="charColor" type="color"></label>
              <label>근무 장소<select id="charWork"></select></label>
              <label>기상 시각<input id="charWake" type="time"></label>
              <label>취침 시각<input id="charBed" type="time"></label>
            </div>
            <div class="chip-section"><h3>입맛</h3><div id="tasteChips" class="chips"></div></div>
            <div class="chip-section"><h3>관심사</h3><div id="interestChips" class="chips"></div></div>
            <div class="chip-section"><h3>취미</h3><div id="hobbyChips" class="chips"></div></div>
            <div class="actions"><button type="submit">캐릭터 저장</button><button type="button" id="deleteCharacter" class="danger">삭제</button></div>
          </form>
        </article>
      </div>
    </section>

    <section id="view-relations" class="view hidden"><div class="panel page-panel"><h1>관계</h1><p class="muted">관계는 캐릭터별 취향과 별개로 저장됩니다.</p><div id="relations"></div></div></section>
    <section id="view-routines" class="view hidden"><div class="panel page-panel"><h1>주간 루틴</h1><div id="routines"></div></div></section>

    <section id="view-village" class="view hidden">
      <div class="page-title"><h1>마을 설정</h1><button id="newTown">+ 빈 마을 추가</button></div>
      <div class="village-grid">
        <aside class="panel village-tools">
          <label>편집할 마을<select id="editTown"></select></label>
          <label>마을 이름<input id="townName"></label>
          <label>배경 그림<input id="townBackground" type="file" accept="image/*"></label>
          <div class="actions"><button id="saveTown">마을 저장</button><button id="addBuilding" class="soft">+ 건물</button></div>
          <p class="muted">건물은 이 화면에서만 움직일 수 있어요. 점선 도로 가까이 놓으면 길에 붙습니다.</p>
          <div id="buildingEditor"></div>
        </aside>
        <article class="panel"><div class="editor-help">도로 점을 드래그하고, 선 끝의 ＋를 눌러 새 길을 이어 보세요.</div><div id="townEditor" class="town-canvas editor"></div></article>
      </div>
    </section>

    <section id="view-settings" class="view hidden"><div class="panel page-panel"><h1>설정</h1>
      <div class="setting-row"><span>화면 모드</span><select id="themeMode"><option value="light">라이트</option><option value="dark">다크</option></select></div>
      <div class="setting-row"><span>데이터 백업</span><div><button id="exportData" class="soft">내보내기</button><label class="soft file-label">불러오기<input id="importData" type="file" accept=".json" hidden></label></div></div>
      <p class="notice">이 버전은 Google 지도 API를 전혀 사용하지 않습니다. Google 로그인은 기존 config.js의 Firebase 설정을 그대로 읽습니다.</p>
    </div></section>
  </main>
</div>
<div id="toast"></div>
<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>

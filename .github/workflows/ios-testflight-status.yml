name: iOS TestFlight status
on:
  push:
    branches: [dev]
    paths: [.github/ios-testflight-status-request.json]
  workflow_dispatch:
    inputs:
      action:
        description: Read status or perform the explicitly authorized iOS 507 hotfix action
        type: choice
        default: status
        options: [status, hotfix507-status, hotfix507-prepare, hotfix507-submit, production511-status, production511-prepare, production511-submit, production512-status, production512-prepare, production512-submit, production514-status, production514-prepare, production514-submit, production515-status, production515-prepare, production515-submit, production520-status, production520-prepare, production520-submit, production522-status, production522-prepare, production522-submit, production523-status, production523-prepare, production523-submit, production524-status, production524-prepare, production524-submit, production525-status, production525-prepare, production525-submit]
permissions:
  contents: read
jobs:
  status:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apple status or explicit iOS 507 hotfix submission
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_ACTION: ${{ inputs.action || 'status' }}
        run: |
          case "$APPLE_ACTION" in
            status) node scripts/ios-asc-status.mjs status ;;
            hotfix507-status) node scripts/ios-submit507.mjs status ;;
            hotfix507-prepare) node scripts/ios-submit507.mjs prepare ;;
            hotfix507-submit) node scripts/ios-submit507.mjs submit ;;
            production511-status) node scripts/ios-submit511.mjs status ;;
            production511-prepare) node scripts/ios-submit511.mjs prepare ;;
            production511-submit) node scripts/ios-submit511.mjs submit ;;
            production512-status) node scripts/ios-submit512.mjs status ;;
            production512-prepare) node scripts/ios-submit512.mjs prepare ;;
            production512-submit) node scripts/ios-submit512.mjs submit ;;
            production514-status) node scripts/ios-submit514.mjs status ;;
            production514-prepare) node scripts/ios-submit514.mjs prepare ;;
            production514-submit) node scripts/ios-submit514.mjs submit ;;
            production515-status) node scripts/ios-submit515.mjs status ;;
            production515-prepare) node scripts/ios-submit515.mjs prepare ;;
            production515-submit) node scripts/ios-submit515.mjs submit ;;
            production520-status) node scripts/ios-submit520.mjs status ;;
            production520-prepare) node scripts/ios-submit520.mjs prepare ;;
            production520-submit) node scripts/ios-submit520.mjs submit ;;
            production522-status) node scripts/ios-submit522.mjs status ;;
            production522-prepare) node scripts/ios-submit522.mjs prepare ;;
            production522-submit) node scripts/ios-submit522.mjs submit ;;
            production523-status) node scripts/ios-submit523.mjs status ;;
            production523-prepare) node scripts/ios-submit523.mjs prepare ;;
            production523-submit) node scripts/ios-submit523.mjs submit ;;
            production524-status) node scripts/ios-submit524.mjs status ;;
            production524-prepare) node scripts/ios-submit524.mjs prepare ;;
            production524-submit) node scripts/ios-submit524.mjs submit ;;
            production525-status) node scripts/ios-submit525.mjs status ;;
            production525-prepare) node scripts/ios-submit525.mjs prepare ;;
            production525-submit) node scripts/ios-submit525.mjs submit ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-status-${{ github.run_id }}
          path: ios/build/testflight-reports/*.json
          retention-days: 3

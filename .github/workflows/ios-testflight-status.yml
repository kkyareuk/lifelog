name: iOS TestFlight status
on:
  push:
    branches: [dev]
    paths: [.github/ios-testflight-status-request.json]
  workflow_dispatch:
    inputs:
      action:
        description: Read status or perform the explicitly authorized iOS 507 hotfix action
        type: choice
        default: status
        options: [status, hotfix507-status, hotfix507-prepare, hotfix507-submit, production511-status, production511-prepare, production511-submit, production512-status, production512-prepare, production512-submit, production514-status, production514-prepare, production514-submit]
permissions:
  contents: read
jobs:
  status:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apple status or explicit iOS 507 hotfix submission
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_ACTION: ${{ inputs.action || 'status' }}
        run: |
          case "$APPLE_ACTION" in
            status) node scripts/ios-asc-status.mjs status ;;
            hotfix507-status) node scripts/ios-submit507.mjs status ;;
            hotfix507-prepare) node scripts/ios-submit507.mjs prepare ;;
            hotfix507-submit) node scripts/ios-submit507.mjs submit ;;
            production511-status) node scripts/ios-submit511.mjs status ;;
            production511-prepare) node scripts/ios-submit511.mjs prepare ;;
            production511-submit) node scripts/ios-submit511.mjs submit ;;
            production512-status) node scripts/ios-submit512.mjs status ;;
            production512-prepare) node scripts/ios-submit512.mjs prepare ;;
            production512-submit) node scripts/ios-submit512.mjs submit ;;
            production514-status) node scripts/ios-submit514.mjs status ;;
            production514-prepare) node scripts/ios-submit514.mjs prepare ;;
            production514-submit) node scripts/ios-submit514.mjs submit ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-status-${{ github.run_id }}
          path: ios/build/testflight-reports/*.json
          retention-days: 3

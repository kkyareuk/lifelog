name: iOS 507 authorized production hotfix
on:
  workflow_dispatch:
    inputs:
      action:
        description: Exact iOS 507 hotfix action authorized on 2026-09-27
        type: choice
        required: true
        options: [status, prepare, submit]
permissions:
  contents: read
concurrency:
  group: ios507-review
  cancel-in-progress: false
jobs:
  submit:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Perform exact authorized hotfix action
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          HOTFIX_ACTION: ${{ inputs.action }}
        run: node scripts/ios-submit507.mjs "$HOTFIX_ACTION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios507-review-status-${{ github.run_id }}
          path: ios/build/testflight-reports/*.json
          retention-days: 3
          if-no-files-found: ignore

name: iOS signing capability audit
on:
  push:
    branches: [dev]
    paths: [scripts/ios-signing-audit.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect existing profile and Apple capability without mutation
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node scripts/ios-signing-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ios-signing-audit
          path: ios/build/testflight-reports/signing-audit.json
          retention-days: 3

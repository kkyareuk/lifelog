<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>평행도시 이용약관</title><link rel="stylesheet" href="./app.css"></head><body><main style="max-width:850px"><article class="panel page-panel"><h1>이용약관</h1><p>평행도시는 창작 캐릭터의 가상 생활을 관찰하는 시뮬레이션입니다. 실존 인물의 위치·일정·생활 패턴을 추적하거나 재현하는 목적으로 이용할 수 없습니다.</p><p>사용자가 등록한 이미지와 설정에 대한 권리는 해당 사용자에게 있으며, 타인의 권리를 침해하는 자료를 등록해서는 안 됩니다.</p><p>서비스의 시뮬레이션 결과는 모두 허구이며 실제 위치 정보가 아닙니다.</p><a class="soft" href="./index.html">돌아가기</a></article></main></body></html>

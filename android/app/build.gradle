apply plugin: 'com.android.application'

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "com.drawervillage.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.drawervillage.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        buildConfigField "boolean", "WEBVIEW_INSPECTION", "false"
        versionCode 376
        versionName "1.0.328"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Capacitor/Firebase plugins are discovered dynamically. Release-time
            // shrinking can remove classes that are valid at runtime and make the
            // installed app terminate before the WebView is ready.
            minifyEnabled false
            shrinkResources false
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        inspect {
            initWith release
            matchingFallbacks = ['release']
            versionNameSuffix "-inspect"
            buildConfigField "boolean", "WEBVIEW_INSPECTION", "true"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.android.billingclient:billing:9.1.0"
    implementation "com.google.android.gms:play-services-games-v2:21.0.0"
}

apply from: 'capacitor.build.gradle'

// OneDrive may expose copied web assets as reparse-point files, which Gradle's
// snapshotter rejects as "not a regular file". Hydrate byte-for-byte copies in
// a generated directory outside OneDrive and package that directory instead.
def externalAssetsDir = file('C:/Users/Public/drawervillage-android-assets/main')
android.sourceSets.main.assets.srcDirs = [externalAssetsDir]

def prepareExternalWebAssets = tasks.register('prepareExternalWebAssets', Exec) {
    // Declare external writes so Gradle invalidates its virtual filesystem cache.
    outputs.dir externalAssetsDir
    outputs.upToDateWhen { false }
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('../copy-assets-for-gradle.ps1').absolutePath,
            '-Source', file('src/main/assets').absolutePath,
            '-WebSource', rootProject.file('../www').absolutePath,
            '-Destination', externalAssetsDir.absolutePath
}

tasks.configureEach { task ->
    if ((task.name.toLowerCase().contains('merge') && task.name.toLowerCase().contains('assets')) || task.name.toLowerCase().contains('lint')) {
        task.dependsOn prepareExternalWebAssets
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Inspection APKs are for USB diagnosis only, never store bundles.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().startsWith('bundleinspect') }) {
        throw new GradleException('Inspection builds must not be uploaded to stores. Build assembleInspect instead.')
    }
}

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>평행도시 로그인</title><link rel="stylesheet" href="./app.css"></head><body><main style="max-width:560px;padding-top:10vh"><article class="panel page-panel"><h1>평행도시 로그인</h1><p class="muted">같은 Google 계정으로 로그인하면 기기 사이에서 캐릭터와 마을을 동기화해요.</p><button id="google">Google 계정으로 계속</button><a class="soft" href="./index.html" style="margin-left:8px;text-decoration:none">돌아가기</a><p id="message"></p></article></main><script src="./config.js"></script><script type="module">
const m=document.querySelector('#message'),cfg=window.PARALLEL_CITY_CONFIG?.firebase;
if(!cfg?.apiKey){m.textContent='기존 config.js의 Firebase 웹 앱 설정을 확인해 주세요.'}
document.querySelector('#google').onclick=async()=>{try{const[{initializeApp},{getAuth,GoogleAuthProvider,signInWithPopup,setPersistence,browserLocalPersistence}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js')]);const auth=getAuth(initializeApp(cfg));await setPersistence(auth,browserLocalPersistence);await signInWithPopup(auth,new GoogleAuthProvider());location.href='./index.html'}catch(e){m.textContent='로그인 실패: '+e.message}};
</script></body></html>

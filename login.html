<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 · 평행도시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<script src="./config.js?v=20260805i"></script>
<style>
:root{--a:#6f7cff;--b:#b36cff;--ink:#202334;--muted:#73798d;--line:#e1e5ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Do Hyeon","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 4%,#dce2ff,transparent 34%),radial-gradient(circle at 96% 5%,#efdfff,transparent 32%),#f4f6fb}
.card{width:min(460px,calc(100% - 28px));background:#fff;border:1px solid var(--line);border-radius:30px;padding:30px;box-shadow:0 24px 70px #31385620}.logo{width:72px;height:72px;border-radius:23px;margin:0 auto 18px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 13px 35px #6f7cff4a}.center{text-align:center}h1{margin:0 0 8px;font-size:29px}p{color:var(--muted);font-size:13px;line-height:1.7;margin:0}.google{margin-top:22px;width:100%;border:1px solid #d9deea;background:#fff;border-radius:15px;padding:14px;display:flex;justify-content:center;align-items:center;gap:11px;font-weight:900;font-size:15px;cursor:pointer}.google:hover{background:#f7f8fc}.google:disabled{cursor:not-allowed;opacity:.55}.g{font:900 22px Arial;color:#4285f4}.status{margin-top:14px;min-height:22px;color:#db5d70;font-size:12px;line-height:1.55;text-align:center}.status.ok{color:#23845f}.user{display:none;margin-top:20px;padding:16px;border-radius:18px;background:#f5f6fb;border:1px solid var(--line);align-items:center;gap:12px}.user img{width:52px;height:52px;border-radius:50%;object-fit:cover}.user b,.user small{display:block}.user small{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;margin-top:16px}.button{flex:1;text-decoration:none;text-align:center;border:0;border-radius:13px;padding:12px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:900;cursor:pointer}.secondary{background:#f5f6fb;color:var(--ink);border:1px solid var(--line)}.help{margin-top:20px;padding:14px;border-radius:16px;background:#f6f4ff;border:1px solid #ded8ff;color:var(--muted);font-size:11px;line-height:1.65}
.consent{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#f8f9fc;text-align:left;font:12px/1.6 "Malgun Gothic",sans-serif}.consent label{display:flex;align-items:flex-start;gap:9px}.consent input{margin-top:4px}.consent a{color:#5c67d8;font-weight:700}
</style>
</head>
<body>
<main class="card">
  <div class="logo">평행</div>
  <div class="center"><h1>평행도시 로그인</h1><p>Google 계정으로 로그인하고 캐릭터 데이터를 계정에 연결할 준비를 해요.</p></div>
  <div class="consent" id="consentBox"><label><input type="checkbox" id="agree"><span><a href="./terms.html" target="_blank">이용약관</a>과 <a href="./privacy.html" target="_blank">개인정보처리방침</a>을 읽었으며 동의합니다. 생활권과 캐릭터 데이터는 계정 동기화를 위해 저장됩니다.</span></label></div>
  <button class="google" id="googleLogin" disabled><span class="g">G</span> Google 계정으로 계속하기</button>
  <div class="status" id="status"></div>
  <div class="user" id="user"><img id="photo" alt=""><div><b id="name"></b><small id="email"></small></div></div>
  <div class="actions"><a class="button" href="./index.html">평행도시로 이동</a><button class="button secondary" id="logout" hidden>로그아웃</button></div>
  <div class="help">로그인이 차단되면 Firebase 콘솔의 <b>Authentication → 설정 → 승인된 도메인</b>에 <b>kkyareuk.github.io</b>가 있는지 확인해 주세요. 오류가 생기면 위에 정확한 원인을 표시합니다.</div>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signInWithCredential,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp,arrayUnion}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const status=document.querySelector('#status');
const button=document.querySelector('#googleLogin');
const logout=document.querySelector('#logout');
const box=document.querySelector('#user');
const agree=document.querySelector('#agree');
const config=window.PARALLEL_CITY_FIREBASE||window.PARALLEL_CITY_CONFIG?.firebase||{};
const ready=Boolean(config.apiKey&&config.authDomain&&config.projectId&&config.appId);

function showError(error){
  console.error(error);
  status.classList.remove('ok');
  const code=error?.code||'';
  if(code==='auth/unauthorized-domain')status.textContent='Firebase 콘솔 → Authentication → 설정 → 승인된 도메인에 kkyareuk.github.io를 추가해 주세요.';
  else if(code==='auth/configuration-not-found')status.textContent='Firebase 콘솔에서 Authentication을 시작한 뒤 로그인 방법 → Google을 사용 설정하고 저장해 주세요.';
  else if(code==='auth/operation-not-allowed')status.textContent='Firebase 콘솔 → Authentication → 로그인 방법에서 Google 제공업체를 사용 설정해 주세요.';
  else if(code==='auth/popup-blocked')status.textContent='브라우저가 로그인 팝업을 막았어요. 팝업을 허용한 뒤 다시 눌러 주세요.';
  else if(code==='auth/popup-closed-by-user')status.textContent='로그인 창이 닫혔어요. 다시 시도해 주세요.';
  else status.textContent=`Google 로그인 실패: ${error?.message||String(error)}`;
}

if(!ready){
  status.textContent='공용 설정을 읽지 못했어요. config.js가 저장소 최상단에 있는지 확인해 주세요.';
  button.disabled=true;
}else{
  try{
    const app=initializeApp(config);
    const auth=getAuth(app);
    await setPersistence(auth,browserLocalPersistence);
    const database=getFirestore(app);
    const provider=new GoogleAuthProvider();
    auth.languageCode='ko';

    getRedirectResult(auth).catch(showError);
    const accepted=localStorage.getItem('parallelCityTermsVersion')==='2026-07-29';
    agree.checked=accepted;button.disabled=!accepted;
    agree.onchange=()=>{button.disabled=!agree.checked;if(agree.checked)localStorage.setItem('parallelCityTermsVersion','2026-07-29');else localStorage.removeItem('parallelCityTermsVersion')};
    button.onclick=async()=>{
      if(!agree.checked){status.textContent='이용약관과 개인정보처리방침에 동의해 주세요.';return}
      status.classList.remove('ok');
      status.textContent='Google 로그인 창을 여는 중…';
      try{
        if(window.Capacitor?.isNativePlatform?.()&&window.Capacitor?.Plugins?.FirebaseAuthentication){
          const result=await window.Capacitor.Plugins.FirebaseAuthentication.signInWithGoogle();
          await signInWithCredential(auth,GoogleAuthProvider.credential(result.credential?.idToken,result.credential?.accessToken));
        }else await signInWithPopup(auth,provider);
      }catch(error){showError(error)}
    };
    logout.onclick=()=>signOut(auth);
    onAuthStateChanged(auth,async user=>{
      if(user){
        try{
          const ref=doc(database,'users',user.uid),snapshot=await getDoc(ref);
          const registration={
            profile:{name:user.displayName||'',email:user.email||'',photoURL:user.photoURL||'',provider:user.providerData?.[0]?.providerId||'google.com'},
            lastLoginAt:serverTimestamp(),
            lastLoginOrigin:location.origin,
            loginOrigins:arrayUnion(location.origin),
            firebaseProjectId:config.projectId,
            firebaseAppId:config.appId,
            accountSchemaVersion:2
          };
          if(!snapshot.exists())registration.createdAt=serverTimestamp();
          if(!snapshot.data()?.consent?.acceptedAt)registration.consent={termsVersion:'2026-07-29',privacyVersion:'2026-07-29',acceptedAt:serverTimestamp()};
          await setDoc(ref,registration,{merge:true});
        }catch(error){showError(error);return}
        const saved={uid:user.uid,name:user.displayName||'',email:user.email||'',photo:user.photoURL||''};
        localStorage.setItem('parallelCityAuthUser',JSON.stringify(saved));
        box.style.display='flex';
        document.querySelector('#name').textContent=saved.name;
        document.querySelector('#email').textContent=saved.email;
        document.querySelector('#photo').src=saved.photo;
        button.hidden=true;logout.hidden=false;
        status.classList.add('ok');
        status.textContent=`로그인됐어요 · ${config.projectId} 연결됨`;
      }else{
        localStorage.removeItem('parallelCityAuthUser');
        box.style.display='none';button.hidden=false;logout.hidden=true;
        if(status.classList.contains('ok'))status.textContent='';
      }
    });
  }catch(error){showError(error);button.disabled=true}
}
</script>
</body>
</html>

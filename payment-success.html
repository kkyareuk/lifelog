<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 확인 중 · 평행도시</title><script src="./config.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Malgun Gothic",sans-serif;background:#f3f5fa;color:#202334}.box{width:min(500px,calc(100% - 32px));background:#fff;border:1px solid #e2e6f0;border-radius:28px;padding:30px;text-align:center;box-shadow:0 20px 60px #3037551a}h1{margin:0 0 10px}.spin{width:54px;height:54px;margin:auto auto 18px;border-radius:50%;border:6px solid #e6e8ff;border-top-color:#6f7cff;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}a{display:inline-block;margin-top:16px;color:#6f7cff;font-weight:900}</style></head><body><div class="box"><div class="spin" id="spin"></div><h1 id="title">결제를 확인하고 있어요</h1><p id="message">서버에서 금액과 주문 정보를 검증한 뒤 쿠키를 충전합니다.</p><a href="./index.html">평행도시로 돌아가기</a></div><script>(async()=>{const p=new URLSearchParams(location.search),backend=String(window.PARALLEL_CITY_CONFIG?.paymentBackendUrl||'').replace(/\/$/,'');try{if(!backend)throw Error('결제 승인 서버가 설정되지 않았습니다. 결제 인증만으로는 쿠키가 지급되지 않아요.');const r=await fetch(backend+'/payments/confirm',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentKey:p.get('paymentKey'),orderId:p.get('orderId'),amount:Number(p.get('amount'))})});const data=await r.json();if(!r.ok)throw Error(data.message||'결제 승인에 실패했습니다.');document.querySelector('#title').textContent='쿠키 충전 완료! 🍪';document.querySelector('#message').textContent=`${data.cookiesAdded}개가 충전되었어요. 현재 ${data.balance}개를 사용할 수 있어요.`}catch(e){document.querySelector('#title').textContent='결제를 완료하지 못했어요';document.querySelector('#message').textContent=e.message}document.querySelector('#spin').style.display='none'})();</script></body></html>

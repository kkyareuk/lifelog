<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#754b31">
  <title>결제 · 서랍마을</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
  <script src="./config.js"></script>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    :root{--wood:#68432e;--wood2:#b77d4c;--cream:#f7f1e9;--ink:#291f19;--muted:#76685f;--line:#e2d5ca}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Do Hyeon","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--cream)}
    button,a{font:inherit}.wrap{width:min(980px,calc(100% - 28px));margin:18px auto 36px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 16px}.top a{color:var(--ink);font-weight:800;text-decoration:none}.top span{display:flex;align-items:center;gap:8px;font-weight:800}.top img{width:42px;height:42px;object-fit:contain}
    .hero,.card{background:#fff;border:1px solid var(--line);border-radius:28px}.hero{padding:34px;background:linear-gradient(135deg,#34251e,#71472f 58%,#b77d4c);color:#fff}.eyebrow{font-size:12px;letter-spacing:.14em}.hero h1{margin:10px 0 8px;font-size:42px}.hero p{margin:0;line-height:1.7;color:#fffde4}.checkout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;margin-top:18px}.card{padding:26px}.card h2{margin:0 0 18px}.order-lines{display:grid;gap:10px}.order-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:15px;border-radius:16px;background:#f8f3ed}.order-line div{display:grid;gap:4px}.order-line small{color:var(--muted)}.summary{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px dashed var(--line)}.summary.total{border:0;font-size:24px}.pay{width:100%;padding:17px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--wood),var(--wood2));color:#fff;font-weight:900;cursor:pointer}.pay:disabled{opacity:.55}.status,.legal{font-size:12px;line-height:1.65}.status{min-height:22px;margin-top:12px;color:#a14d41}.legal{color:var(--muted)}.notice{padding:14px;border-radius:15px;background:#fff7df;color:#664528;font-weight:800}
    @media(max-width:720px){.checkout{grid-template-columns:1fr}.hero{padding:24px}.hero h1{font-size:32px}.card{padding:20px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top"><a href="./index.html">← 서랍마을로 돌아가기</a><span><img src="./icons/drawer-village-logo.png" alt="">안전한 토스페이먼츠 결제</span></div>
  <section class="hero"><span class="eyebrow">DRAWER VILLAGE CART</span><h1>장바구니 결제</h1><p>고른 상품을 한 번에 결제해요. 구독이나 자동결제가 아닌 일회성 구매입니다.</p></section>
  <section class="checkout">
    <div class="card"><h2>주문 상품</h2><div class="order-lines" id="orderLines"></div><p class="notice">같은 상품을 여러 개 구매하면 수량만큼 슬롯이 계속 추가됩니다.</p><p class="legal">Google 로그인 계정에 구매 내역이 적용됩니다. 결제 후 같은 계정으로 서랍마을에 접속해 주세요.</p></div>
    <div class="card"><h2>주문 확인</h2><div class="summary"><span>상품 수량</span><b id="itemCount">0개</b></div><div class="summary total"><span>결제금액</span><b id="price">0원</b></div><button class="pay" id="payButton" disabled>결제 준비 중</button><div class="status" id="status"></div><p class="legal">비밀 키는 이 페이지나 GitHub에 저장하지 않습니다. 결제 승인 서버의 환경 변수에만 보관해야 합니다.</p></div>
  </section>
</main>
<script>
const config=window.PARALLEL_CITY_CONFIG||{};
const CART_KEY="drawer-village-cart";
const products={
  character_slots_5:{packageId:"character_slots_5",name:"캐릭터 슬롯 5개 추가",amount:1200},
  town_slot_1:{packageId:"town_slot_1",name:"마을 슬롯 1개 추가",amount:1900},
  green_tea:{packageId:"green_tea",name:"개발자에게 녹차 사주기",amount:1500}
};
const params=new URLSearchParams(location.search);
let rawCart={};
try{rawCart=JSON.parse(localStorage.getItem(CART_KEY)||"{}")||{}}catch{}
if(!params.has("cart")&&products[params.get("product")])rawCart={[params.get("product")]:1};
const items=Object.entries(rawCart).filter(([id,quantity])=>products[id]&&Number.isInteger(Number(quantity))&&Number(quantity)>0&&Number(quantity)<=(id==="green_tea"?1:99)).map(([packageId,quantity])=>({packageId,quantity:Number(quantity)}));
const total=items.reduce((sum,item)=>sum+products[item.packageId].amount*item.quantity,0);
const count=items.reduce((sum,item)=>sum+item.quantity,0);
document.querySelector("#orderLines").innerHTML=items.length?items.map(item=>{const product=products[item.packageId],totalName=item.packageId==="character_slots_5"?`캐릭터 ${item.quantity*5}명 추가`:item.packageId==="town_slot_1"?`마을 ${item.quantity}개 추가`:product.name;return `<article class="order-line"><div><b>${totalName}</b><small>${product.name} · ${product.amount.toLocaleString("ko-KR")}원 × ${item.quantity}</small></div><b>${(product.amount*item.quantity).toLocaleString("ko-KR")}원</b></article>`}).join(""):"<p>장바구니가 비어 있어요.</p>";
document.querySelector("#itemCount").textContent=`${count}개`;
document.querySelector("#price").textContent=`${total.toLocaleString("ko-KR")}원`;
const button=document.querySelector("#payButton"),status=document.querySelector("#status");
if(!items.length){status.textContent="상점에서 상품을 먼저 담아 주세요."}
else if(config.paymentsEnabled){button.disabled=false;button.textContent=`토스로 ${total.toLocaleString("ko-KR")}원 결제하기`}
else{status.textContent="토스페이먼츠 상점 심사와 결제 승인 서버 연결이 끝나면 실제 결제가 열립니다."}
button.addEventListener("click",async()=>{
  const clientKey=String(config.tossPaymentsClientKey||"").trim();
  const backend=String(config.paymentBackendUrl||"").replace(/\/$/,"");
  if(!config.paymentsEnabled||!items.length)return;
  if(!clientKey||!backend){status.textContent="결제 승인 서버 설정이 아직 끝나지 않았어요.";return}
  button.disabled=true;status.textContent="안전한 주문을 만들고 있어요.";
  try{
    const response=await fetch(backend+"/payments/orders",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({items,cartVersion:1})});
    if(response.status===401)throw new Error("먼저 Google 계정으로 로그인해 주세요.");
    const order=await response.json();
    if(!response.ok)throw new Error(order.message||"주문을 만들지 못했어요.");
    if(Number(order.amount)!==total)throw new Error("서버에서 확인한 결제금액이 장바구니와 달라요. 결제를 중단했어요.");
    const tossPayments=TossPayments(clientKey);
    const payment=tossPayments.payment({customerKey:order.customerKey});
    await payment.requestPayment({method:"CARD",amount:{currency:"KRW",value:order.amount},orderId:order.orderId,orderName:order.orderName,customerEmail:order.customerEmail,customerName:order.customerName,successUrl:new URL("./payment-success.html",location.href).href,failUrl:new URL("./payment-fail.html",location.href).href});
  }catch(error){status.textContent=error.message||String(error);button.disabled=false}
});
</script>
</body>
</html>

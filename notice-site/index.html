<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서랍마을 · 공지 편지함</title><link rel="stylesheet" href="style.css"><body><header><small>서랍마을 운영실</small><h1>공지 편지함</h1><p>초안을 확인하고, 마을에 소식을 전해 주세요.</p><button id="login">Google 로그인</button><button id="logout" hidden>로그아웃</button><span id="account"></span></header><main><aside><h2>업데이트 초안</h2><div id="drafts"></div></aside><section><div class="heading"><h2>편지 작성</h2><span>인게임 공지사항 · 푸시 없음</span></div><label>제목<input id="subject" maxlength="120" disabled></label><label>내용<textarea id="body" rows="14" maxlength="8000" disabled></textarea></label><p>유저 이메일로는 보내지 않아요. 발송한 공지는 인게임 우편함에 30일 동안 표시돼요.</p><div class="actions"><button id="save" disabled>초안 저장</button><button id="review" disabled>확인 후 전송</button></div><p id="status" role="status" aria-live="polite">관리자 계정으로 로그인해 주세요.</p></section></main><dialog id="preview"><h2>이 내용으로 보낼까요?</h2><p>모든 로그인 유저의 인게임 공지사항에 표시됩니다. 푸시 알림과 이메일은 보내지 않습니다.</p><h3 id="preview-title"></h3><pre id="preview-body"></pre><div class="actions"><button id="cancel">돌아가기</button><button id="send">전송</button></div></dialog><script src="config.js"></script><script type="module" src="app.js"></script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>평행도시 연결 진단</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#242832;font-family:"Malgun Gothic",sans-serif}.wrap{max-width:760px;margin:35px auto;padding:20px}.card{background:#fff;border:1px solid #dfe5eb;border-radius:22px;padding:22px;box-shadow:0 15px 45px #26364b18}h1{margin-top:0}.row{padding:13px;margin:9px 0;border-radius:13px;background:#f5f7fa;border:1px solid #e2e6eb}.ok{color:#187a55}.bad{color:#d34e62}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}button,a{border:0;border-radius:12px;padding:12px 15px;background:#26303d;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.log{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 Consolas,monospace;background:#171b22;color:#dce4ed;padding:15px;border-radius:14px;min-height:110px}#map{height:280px;border-radius:15px;margin-top:14px;background:#e7ebef}</style></head><body><main class="wrap"><section class="card"><h1>평행도시 연결 진단</h1><p>API 키 전체는 표시하지 않습니다. 테스트 버튼을 누를 때만 Google 요청이 발생합니다.</p><div id="configState" class="row"></div><div id="referrerState" class="row"></div><div class="buttons"><button id="mapTest">지도 1회 테스트</button><button id="placeTest">장소 1회 테스트</button><a href="./index.html">돌아가기</a></div><div id="log" class="log">진단 대기 중</div><div id="map"></div></section></main><script>
const cfg=window.PARALLEL_CITY_CONFIG||{},key=String(cfg.googleMapsApiKey||'').trim(),log=document.querySelector('#log');
const write=(message,error=false)=>{log.textContent+=`\n${error?'❌':'•'} ${message}`};
document.querySelector('#configState').innerHTML=key&&!key.includes('여기에_')?`<b class="ok">config.js 읽힘</b> · Maps 키 끝 4자리: ${key.slice(-4)} · Firebase 프로젝트: ${cfg.firebase?.projectId||'없음'}`:'<b class="bad">config.js의 Google Maps 키가 비어 있습니다.</b>';
document.querySelector('#referrerState').innerHTML=`현재 허용 웹사이트에 넣을 주소: <b>${location.origin}${location.pathname.replace(/[^/]+$/,'')}*</b>`;
let loader=null;window.gm_authFailure=()=>write('Google 인증 실패(gm_authFailure): API 키, 결제 계정, 웹사이트 제한을 확인하세요.',true);
function loadGoogle(){if(window.google?.maps?.importLibrary)return Promise.resolve();if(loader)return loader;loader=new Promise((resolve,reject)=>{const cb='pcDiag'+Date.now();window[cb]=()=>{delete window[cb];resolve()};const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&libraries=places&v=weekly&loading=async&callback=${cb}`;s.onerror=()=>reject(new Error('Google 스크립트 네트워크 로드 실패'));document.head.appendChild(s)});return loader}
document.querySelector('#mapTest').onclick=async()=>{log.textContent='지도 테스트 시작';try{if(!key)throw Error('Google Maps 키 없음');await loadGoogle();const {Map}=await google.maps.importLibrary('maps');new Map(document.querySelector('#map'),{center:{lat:37.5665,lng:126.9780},zoom:13,mapTypeId:'roadmap'});write('Maps JavaScript API 성공');}catch(error){write(error.message||String(error),true)}};
document.querySelector('#placeTest').onclick=async()=>{log.textContent='장소 테스트 시작';try{if(!key)throw Error('Google Maps 키 없음');await loadGoogle();const {Place}=await google.maps.importLibrary('places');const result=await Place.searchByText({textQuery:'서울역 카페',fields:['displayName','location'],language:'ko-KR',region:'kr',maxResultCount:1});if(!result.places?.length)throw Error('Places 결과 없음');write(`Places API (New) 성공: ${result.places[0].displayName}`)}catch(error){write(`${error.name||'Error'}: ${error.message||String(error)}`,true)}};
</script></body></html>

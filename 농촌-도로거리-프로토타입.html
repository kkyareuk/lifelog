<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFELOG 농촌 마을 이동 프로토타입</title>
<style>
:root{--panel:#fffdf8;--ink:#26251f;--muted:#69675e;--line:#ddd8ca;--accent:#6d5bd0;--good:#2b8a5c;--warn:#cf7d20;--bad:#c84e4e}
*{box-sizing:border-box}body{margin:0;background:#eee9df;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.app{max-width:1180px;margin:auto;padding:16px}.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0 0 5px}p{margin:0;color:var(--muted);font-size:14px}.controls{display:flex;gap:8px;flex-wrap:wrap}
button,select{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 13px;font-size:14px;color:var(--ink)}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.active{outline:3px solid rgba(109,91,208,.2)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}.mapWrap{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:#ccc;touch-action:none}
.map{display:block;width:100%;height:auto;user-select:none;pointer-events:none}.overlay{position:absolute;inset:0}.road-debug{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
.editing .road-debug{opacity:.65}.building{position:absolute;transform:translate(-50%,-90%);cursor:grab;touch-action:none;text-align:center;z-index:4}
.building:active{cursor:grabbing}.building .icon{width:46px;height:46px;border-radius:14px;background:#fffdf8;border:3px solid white;box-shadow:0 3px 12px #0005;display:grid;place-items:center;font-size:26px}
.building .name{display:inline-block;margin-top:3px;padding:3px 7px;border-radius:8px;background:#fffef0e8;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 1px 5px #0003}
.building.selected .icon{outline:4px solid var(--accent)}.character{position:absolute;transform:translate(-50%,-50%);z-index:6;pointer-events:none}
.character .face{width:34px;height:34px;border-radius:50%;background:#29263a;color:white;border:3px solid white;box-shadow:0 3px 9px #0006;display:grid;place-items:center;font-weight:800}
.character .label{position:absolute;left:50%;bottom:37px;transform:translateX(-50%);background:#202020dd;color:white;border-radius:7px;padding:2px 6px;font-size:11px;white-space:nowrap}
.side{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px}.card{border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{font-size:15px;margin:0 0 9px}.metric{font-size:25px;font-weight:800;margin-top:3px}.small{font-size:12px;color:var(--muted);line-height:1.55}
.legend{display:grid;gap:7px;font-size:13px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px}.status{padding:10px;border-radius:12px;background:#f2efe8;font-size:13px;line-height:1.55}
.routeText{font-weight:700}input[type=range]{width:100%}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}}
@media(max-width:560px){.app{padding:8px}.side{grid-template-columns:1fr}.controls{width:100%}button,select{flex:1}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>농촌 마을 길찾기·보행 테스트</h1>
      <p>건물 위치를 옮겨도 가장 가까운 길에 자동 연결되고, 캐릭터는 길을 따라 이동합니다.</p>
    </div>
    <div class="controls">
      <button id="editBtn">건물 편집</button>
      <select id="destSelect" aria-label="목적지 선택"></select>
      <button id="walkBtn" class="primary">걷기 시작</button>
      <button id="resetBtn">초기화</button>
    </div>
  </div>

      <svg class="road-debug" id="roadSvg" viewBox="0 0 1000 728" preserveAspectRatio="none"></svg>
      <div class="overlay" id="overlay"></div>
      <div class="character" id="character"><div class="label">네리네</div><div class="face">N</div></div>
    </div>
    <aside class="side">
      <div class="card"><h2>거리 판정</h2><div id="distanceClass" class="metric">—</div><div id="distanceDetail" class="small">목적지를 고른 뒤 걷기를 시작하세요.</div></div>
      <div class="card"><h2>이동 상태</h2><div id="status" class="status">집에서 대기 중</div></div>
      <div class="card"><h2>속도</h2><input id="speed" type="range" min="0.5" max="4" step="0.5" value="1.5"><div class="small"><span id="speedText">1.5×</span> · 실제 서비스에서는 일정의 출발·도착 시각에 맞춰 자동 계산</div></div>
      <div class="card"><h2>편집 모드 사용법</h2><div class="small">건물을 눌러 끌어놓으세요. 놓은 위치에서 가장 가까운 도로 노드가 자동 지정됩니다. 보라색 선은 개발용 숨은 도로망입니다.</div></div>
      <div class="card"><h2>판정 기준</h2><div class="legend">
        <div><span class="dot" style="background:var(--good)"></span>가까움: 도로거리 230 이하</div>
        <div><span class="dot" style="background:var(--warn)"></span>보통: 231–480</div>
        <div><span class="dot" style="background:var(--bad)"></span>멀음: 481 이상</div>
      </div></div>
    </aside>
  </div>
</div>
<script>
const W=1000,H=728;
const nodes={a:[65,610],b:[150,555],c:[250,515],d:[365,520],e:[455,470],f:[560,425],g:[675,380],h:[785,335],i:[925,290],j:[100,430],k:[210,390],l:[325,345],m:[440,310],n:[555,280],o:[675,245],p:[815,205],q:[940,170],r:[160,245],s:[285,215],t:[415,190],u:[560,155],v:[715,125],w:[880,100],x:[455,590],y:[610,555],z:[760,520],aa:[900,470]};
const edges=[['a','b'],['b','c'],['c','d'],['d','e'],['e','f'],['f','g'],['g','h'],['h','i'],['j','k'],['k','l'],['l','m'],['m','n'],['n','o'],['o','p'],['p','q'],['r','s'],['s','t'],['t','u'],['u','v'],['v','w'],['b','j'],['j','r'],['c','k'],['k','s'],['d','l'],['l','t'],['e','m'],['m','u'],['f','n'],['n','v'],['g','o'],['o','w'],['h','p'],['i','q'],['d','x'],['x','y'],['y','z'],['z','aa'],['aa','i'],['f','y'],['g','z']];
const buildings=[
{id:'home',name:'네리네의 집',icon:'🏠',x:110,y:650,node:'a'},
{id:'hospital',name:'병원',icon:'🏥',x:695,y:405,node:'g'},
{id:'cafe',name:'카페',icon:'☕',x:350,y:370,node:'l'},
{id:'market',name:'시장',icon:'🛒',x:590,y:180,node:'u'},
{id:'school',name:'학교',icon:'🏫',x:850,y:230,node:'p'},
{id:'park',name:'공원',icon:'🌳',x:890,y:510,node:'aa'}];
let editing=false,currentNode='a',anim=null,progress=0;
const overlay=document.getElementById('overlay'),mapWrap=document.getElementById('mapWrap'),character=document.getElementById('character'),destSelect=document.getElementById('destSelect'),status=document.getElementById('status'),dc=document.getElementById('distanceClass'),dd=document.getElementById('distanceDetail');
const pctX=x=>x/W*100,pctY=y=>y/H*100;
function nearestNode(x,y){let best=null,bd=Infinity;for(const [id,[nx,ny]] of Object.entries(nodes)){const d=Math.hypot(x-nx,y-ny);if(d<bd){bd=d;best=id}}return best}
function graph(){const g={};for(const id in nodes)g[id]=[];for(const [a,b] of edges){const d=Math.hypot(nodes[a][0]-nodes[b][0],nodes[a][1]-nodes[b][1]);g[a].push([b,d]);g[b].push([a,d])}return g}
const G=graph();
function shortest(start,end){const dist={},prev={},todo=new Set(Object.keys(nodes));for(const n of todo)dist[n]=Infinity;dist[start]=0;while(todo.size){let u=null;for(const n of todo)if(u===null||dist[n]<dist[u])u=n;todo.delete(u);if(u===end||dist[u]===Infinity)break;for(const [v,w] of G[u])if(todo.has(v)&&dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u}}const path=[];let cur=end;while(cur){path.unshift(cur);if(cur===start)break;cur=prev[cur]}return{path,distance:dist[end]}}
function classDistance(d){if(d<=230)return['가까움','var(--good)'];if(d<=480)return['보통','var(--warn)'];return['멀음','var(--bad)']}
function updateDistance(){const b=buildings.find(x=>x.id===destSelect.value),r=shortest(currentNode,b.node),[label,color]=classDistance(r.distance);dc.textContent=label;dc.style.color=color;dd.textContent=`도로 기준 약 ${Math.round(r.distance)} 거리 단위 · ${r.path.length-1}개 구간`}
function renderRoads(){const svg=document.getElementById('roadSvg');svg.innerHTML=edges.map(([a,b])=>`<line x1="${nodes[a][0]}" y1="${nodes[a][1]}" x2="${nodes[b][0]}" y2="${nodes[b][1]}" stroke="#6d5bd0" stroke-width="7" stroke-linecap="round"/>`).join('')+Object.entries(nodes).map(([id,[x,y]])=>`<circle cx="${x}" cy="${y}" r="7" fill="#fff" stroke="#6d5bd0" stroke-width="4"/>`).join('')}
function renderBuildings(){overlay.innerHTML='';for(const b of buildings){const el=document.createElement('div');el.className='building';el.style.left=pctX(b.x)+'%';el.style.top=pctY(b.y)+'%';el.innerHTML=`<div class="icon">${b.icon}</div><div class="name">${b.name}</div>`;el.addEventListener('pointerdown',e=>beginDrag(e,b,el));overlay.appendChild(el)}}
function beginDrag(e,b,el){if(!editing)return;e.preventDefault();el.classList.add('selected');el.setPointerCapture(e.pointerId);const move=ev=>{const r=mapWrap.getBoundingClientRect();b.x=Math.max(20,Math.min(W-20,(ev.clientX-r.left)/r.width*W));b.y=Math.max(20,Math.min(H-20,(ev.clientY-r.top)/r.height*H));el.style.left=pctX(b.x)+'%';el.style.top=pctY(b.y)+'%'};const up=()=>{b.node=nearestNode(b.x,b.y);const[nx,ny]=nodes[b.node];b.x=nx;b.y=ny-18;el.style.left=pctX(b.x)+'%';el.style.top=pctY(b.y)+'%';el.classList.remove('selected');updateDistance();el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up)};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up)}
function pointAlong(points,t){let lens=[],total=0;for(let i=1;i<points.length;i++){const d=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);lens.push(d);total+=d}let rem=t*total;for(let i=0;i<lens.length;i++){if(rem<=lens[i]){const a=points[i],b=points[i+1],r=rem/lens[i];return[a[0]+(b[0]-a[0])*r,a[1]+(b[1]-a[1])*r]}rem-=lens[i]}return points.at(-1)}
function placeCharacter(x,y){character.style.left=pctX(x)+'%';character.style.top=pctY(y)+'%'}
function startWalk(){cancelAnimationFrame(anim);progress=0;const b=buildings.find(x=>x.id===destSelect.value),res=shortest(currentNode,b.node),pts=res.path.map(id=>nodes[id]),[label]=classDistance(res.distance);status.innerHTML=`<span class="routeText">${buildings.find(x=>x.node===currentNode)?.name||'현재 위치'} → ${b.name}</span><br>${label} 거리 · 길을 따라 이동 중`;let last=performance.now();const step=now=>{progress+=((now-last)/1000)*0.075*Number(document.getElementById('speed').value);last=now;const[x,y]=pointAlong(pts,Math.min(1,progress));placeCharacter(x,y);if(progress<1)anim=requestAnimationFrame(step);else{currentNode=b.node;status.textContent=`${b.name}에 도착`;updateDistance()}};anim=requestAnimationFrame(step)}
for(const b of buildings.filter(b=>b.id!=='home')){const o=document.createElement('option');o.value=b.id;o.textContent=b.name;destSelect.appendChild(o)}
document.getElementById('editBtn').addEventListener('click',e=>{editing=!editing;mapWrap.classList.toggle('editing',editing);e.currentTarget.classList.toggle('active',editing);e.currentTarget.textContent=editing?'편집 완료':'건물 편집'});
document.getElementById('walkBtn').addEventListener('click',startWalk);
document.getElementById('resetBtn').addEventListener('click',()=>location.reload());
destSelect.addEventListener('change',updateDistance);
document.getElementById('speed').addEventListener('input',e=>document.getElementById('speedText').textContent=e.target.value+'×');
renderRoads();renderBuildings();placeCharacter(...nodes.a);updateDistance();
</script>
</body>

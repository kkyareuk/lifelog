<!doctype html>
<html lang="ko" class="native-app" data-color-mode="dark" data-active-tab="relationship">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="../app.css?v=20260906hotfix236">
  <title>시선 설정 스크롤 검수</title>
</head>
<body>
  <dialog open class="character-view-dialog relationship-fullscreen-dialog relationship-viewpoint-dialog">
    <form method="dialog">
      <header class="relationship-editor-head">
        <button value="close" class="relationship-back-button"><img src="../assets/home-ui/back.png" alt=""></button>
        <div class="relationship-editor-pair"><figure><span class="avatar">가</span><b>가람</b></figure><i></i><figure><span class="avatar">나</span><b>나래</b></figure></div>
      </header>
      <div class="character-view-fields relationship-all-fields">
        <label class="relationship-view-field"><b>첫인상</b><select><option>편안함</option></select></label>
        <label class="relationship-view-field"><b>말투</b><select><option>다정함</option></select></label>
        <label class="relationship-view-field"><b>거리감</b><select><option>가까움</option></select></label>
        <label class="relationship-view-field"><b>신뢰</b><select><option>신뢰함</option></select></label>
        <label class="relationship-view-field"><b>존중</b><select><option>존중함</option></select></label>
        <label class="relationship-view-field"><b>질투</b><select><option>조금</option></select></label>
        <label class="relationship-view-field"><b>호기심</b><select><option>많음</option></select></label>
        <label class="relationship-view-field"><b>긴장</b><select><option>보통</option></select></label>
        <label class="relationship-view-field"><b>보호 본능</b><select><option>강함</option></select></label>
        <label class="relationship-view-field"><b>솔직함</b><select><option>솔직함</option></select></label>
        <label class="relationship-view-field"><b>의존</b><select><option>낮음</option></select></label>
        <label class="relationship-view-field"><b>경계</b><select><option>낮음</option></select></label>
        <label class="relationship-view-field"><b>갈등 방식</b><select><option>대화함</option></select></label>
        <label class="relationship-view-field"><b>화해 방식</b><select><option>먼저 다가감</option></select></label>
        <label class="relationship-view-field view-overall"><b>전체적인 시선</b><select><option>소중하게 여김</option></select></label>
        <label class="relationship-view-field view-aggressionAction" data-last-view-field><b>마지막 충동 단계</b><select><option>행동하지 않음</option></select></label>
      </div>
    </form>
  </dialog>
</body>
</html>

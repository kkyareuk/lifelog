<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>마을 산책 218 모바일 검수</title>
  <link rel="stylesheet" href="../app.css?v=20260905hotfix220">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#6d8d65;font-family:sans-serif}.qa-world{position:relative;width:384px;height:854px;margin:auto;overflow:hidden;background:linear-gradient(145deg,#a9c985,#78a87c)}.qa-world::before{position:absolute;inset:10% -20%;content:"";background:linear-gradient(150deg,transparent 42%,#eadbb2 43% 49%,transparent 50%),linear-gradient(25deg,transparent 44%,#dfd1aa 45% 51%,transparent 52%);opacity:.9}.qa-place{position:absolute;left:50%;top:50%;z-index:2;display:grid;place-items:center;width:68px;height:68px;border:4px solid #e8f5ff;border-radius:50%;background:#67b9dd;font-size:38px;transform:translate(-50%,-50%);box-shadow:0 5px 0 #397b9c}.qa-world .town-traveler{animation-play-state:paused}.qa-world .town-traveler.is-decoration-visit{animation:none}.qa-title{position:absolute;z-index:100;left:12px;top:12px;margin:0;padding:9px 12px;border-radius:13px;background:#fffdeedb;color:#352b20;font-size:14px}
  </style>
</head>
<body>
  <main class="qa-world" data-qa-world>
    <h1 class="qa-title">분수 방문 7명 · 마을 산책 4명</h1>
    <div class="qa-place" aria-label="분수">⛲</div>
  </main>
  <script>
    const world=document.querySelector("[data-qa-world]");
    const visitorNames=["네리데","크로","안테","리바이","에테르날리스","집소필라","젠할린"];
    visitorNames.forEach((name,index)=>{
      const ring=Math.floor(index/6),angle=(index%6)*Math.PI/3+(ring%2?Math.PI/6:0),radius=16+ring*12;
      const x=Math.max(14,Math.min(86,50+Math.cos(angle)*radius)),y=Math.max(17,Math.min(84,50+Math.sin(angle)*radius*.45));
      world.insertAdjacentHTML("beforeend",`<button class="town-traveler is-decoration-visit" style="left:${x}%;top:${y}%"><span class="town-traveler-visual"><span class="avatar" style="--own:hsl(${index*47} 45% 45%)">${name[0]}</span><i>✨</i></span><span class="town-traveler-status"><b>${name}</b><small>분수 구경 중</small></span></button>`);
    });
    const routes=[[[16,25],[38,18],[70,24],[84,48],[68,76],[34,80]],[[20,72],[18,42],[42,20],[76,18],[83,55],[58,79]],[[14,48],[31,24],[61,18],[84,35],[78,72],[43,82]],[[26,18],[67,20],[84,44],[72,78],[37,75],[16,52]]];
    ["메다","피클로","덴데","네리네"].forEach((name,index)=>{const route=routes[index],style=route.map((point,i)=>`--route-x${i}:${point[0]}%;--route-y${i}:${point[1]}%`).join(";");world.insertAdjacentHTML("beforeend",`<button class="town-traveler is-village-walk" style="left:${route[0][0]}%;top:${route[0][1]}%;--traveler-delay:${-index*1.15}s;--route-duration:${25+index}s;${style}"><span class="town-traveler-visual"><span class="avatar" style="--own:hsl(${190+index*38} 48% 42%)">${name[0]}</span><i>👣</i></span><span class="town-traveler-status"><b>${name}</b><small>마을 산책 중</small></span></button>`)});
  </script>
</body>
</html>

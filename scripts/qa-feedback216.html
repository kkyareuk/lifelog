<!doctype html>
<html lang="ko" class="native-app" data-color-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>피드백 216 모바일 화면 검수</title>
  <link rel="stylesheet" href="../app.css?v=20260905feedback216">
  <link rel="stylesheet" href="../character-book.css?v=20260905feedback216">
  <style>
    html.native-app,html.native-app body{height:auto!important;min-height:100%;overflow:auto!important}body{margin:0;padding:18px;background:#7b5a43}.qa-stack{display:grid;gap:22px;max-width:920px;margin:auto}.qa-panel{position:relative;padding:18px;border-radius:24px;background:#fffaf1}.qa-panel>h2{margin:0 0 14px}.taste-category-list{display:grid;gap:12px}.book-form-field{margin:0}.qa-panel .official-relation-fields{position:static!important;inset:auto!important;display:grid!important;gap:12px}.qa-panel .official-relation-fields label{position:static!important;display:grid!important;width:auto!important;gap:7px}.qa-panel .official-relation-fields label>b{color:#251c18!important;-webkit-text-fill-color:#251c18!important;-webkit-text-stroke:0!important}.qa-panel .official-relation-fields select{width:100%}
  </style>
</head>
<body>
  <main class="qa-stack">
    <section class="qa-panel"><h2>소지품 선택</h2><div class="taste-category-list">
      <div class="book-form-field"><b>보유한 음식 · 사전</b><button><span>오므라이스 · 딸기 케이크 +1</span><i>＋</i></button></div>
      <div class="book-form-field"><b>보유한 음료 · 사전</b><button><span>레몬 소다</span><i>＋</i></button></div>
      <div class="book-form-field"><b>보유한 책 · 사전</b><button><span>자정의 서랍</span><i>＋</i></button></div>
      <div class="book-form-field"><b>보유한 전자기기 · 사전</b><button><span>2개 선택됨</span><i>＋</i></button></div>
    </div></section>
    <section class="qa-panel"><h2>부부 관계</h2><div class="official-relation-fields"><label class="official-outside-field"><b>관계가 밖에서 다뤄지는 방식</b><select><option>법적으로 관계가 등록됨</option><option selected>법적으로 관계가 등록되지 않음</option></select></label></div></section>
    <section class="mailbox-shell panel" style="--character-own:#76523f"><div class="mailbox-heading"><span><img src="../assets/home-ui/mailbox.png" alt=""></span><div><small>CHARACTER MAIL</small><h1>우편함</h1><p>캐릭터에게서 온 편지를 한곳에서 확인해요.</p></div><button class="mail-delete-all-button">편지 모두 삭제</button></div><article class="character-mail-card has-mail" data-mail-id="sample"><div><small>2026. 9. 5. 오후 3:30</small><h2>오늘 저녁에는 뭘 할까요?</h2><p>잠깐 시간이 남았는데 같이 골라 주세요.</p></div><div class="mail-card-actions"><button>편지 열기</button><button class="mail-delete-button">삭제</button></div></article></section>
  </main>
</body>
</html>

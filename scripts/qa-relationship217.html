<!doctype html>
<html lang="ko" class="native-app" data-color-mode="light" data-active-tab="relationship">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>관계 편집 217 모바일 검수</title>
  <link rel="stylesheet" href="../app.css?v=20260905hotfix221">
  <style>html,body{min-height:100%;background:#d8c7ae}dialog.relation-editor-dialog[open]{position:relative!important;inset:auto!important;width:384px!important;max-width:384px!important;height:854px!important;max-height:854px!important;margin:20px auto!important;box-shadow:0 18px 50px #3d2d2355}</style>
</head>
<body>
<dialog open class="relation-dialog relation-editor-dialog relationship-fullscreen-dialog"><form method="dialog">
  <header class="relationship-editor-head official-editor-head"><button value="save" class="relationship-back-button"><img src="../assets/home-ui/back.png" alt=""></button><span class="official-editor-heading"><small>OFFICIAL RELATIONSHIP</small><b>공식 관계 편집</b></span></header>
  <label class="official-name-field"><span>관계 이름</span><input value="크로네리"></label>
  <section class="official-member-section"><b>관계에 포함할 캐릭터 · 두 명 이상</b><div class="official-member-picker">
    <button type="button">안테</button><button type="button">리바이</button><button type="button" class="on">네리네</button><button type="button" class="on">크로</button><button type="button">에테르날리스</button><button type="button">집소필라</button><button type="button">젠할린</button><button type="button">ネリネ</button><button type="button">새 캐릭터</button><button type="button">메다</button><button type="button">피콜로</button><button type="button">덴데</button><button type="button">아주 긴 이름의 캐릭터</button>
  </div></section>
  <div class="official-relation-fields">
    <label class="official-type-title"><span>관계 종류</span><select><option selected>부부</option></select></label>
    <label class="official-stage-field"><b>현재 관계 단계</b><select><option>생활 동반자</option></select></label>
    <label class="official-past-toggle"><b>과거의 관계</b><input type="checkbox"><small>헤어진 연인, 이혼한 부부, 절연한 친구처럼 바뀝니다.</small></label>
    <section class="official-order-card"><b>관계 구성원 표시 순서</b><small>선택한 모든 캐릭터를 관계 장면에 표시할 순서로 정렬해요.</small><div class="official-order-list">
      <div class="official-order-person"><em>1</em><span><i>네</i></span><b>네리네</b><nav><button disabled>↑</button><button>↓</button></nav></div>
      <div class="official-order-person"><em>2</em><span><i>크</i></span><b>크로</b><nav><button>↑</button><button>↓</button></nav></div>
      <div class="official-order-person"><em>3</em><span><i>메</i></span><b>메다</b><nav><button>↑</button><button disabled>↓</button></nav></div>
    </div></section>
    <label class="official-outside-field"><b>관계가 밖에서 다뤄지는 방식</b><select><option>가까운 사람에게만 알림</option></select></label>
    <fieldset class="official-marriage-registration"><legend>법적 등록 여부</legend><label><input type="radio" name="registration" checked><span>법적으로 등록됨</span></label><label><input type="radio" name="registration"><span>법적으로 등록되지 않음</span></label></fieldset>
    <label class="official-tags-field"><b>관계 태그 추가하기</b><button type="button"><span>0개 태그</span></button></label>
  </div>
  <div class="official-relation-toggles"><label><span>함께 살기</span><input type="checkbox" checked></label><label><span>함께 다니기</span><input type="checkbox"></label></div>
  <div class="relationship-editor-actions"><button value="cancel">취소</button><button class="primary" value="save">저장</button></div>
</form></dialog>
</body>
</html>

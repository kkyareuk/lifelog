<script>

</script></head><body><div id="app"></div><aside id="qa"><button data-hour="12">낮 검수</button><button data-hour="18">노을 검수</button><button data-hour="22">밤 검수</button><button id="qa-en">EN</button><button id="qa-ja">JA</button></aside>

<script type="module">
import '../app.js?v=20260831town181';
